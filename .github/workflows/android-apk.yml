name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "assets/**"
      - "components/**"
      - "lib/**"
      - "app.config.ts"
      - "babel.config.js"
      - "eas.json"
      - "metro.config.js"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Expo's generated release variant embeds JS and uses the test signing key.
      # This is a sideload test build, not a Play Store signing configuration.
      - name: Verify bundled application
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/inkform-bundle
          test -s /tmp/inkform-bundle

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: inkform-android-standalone-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
